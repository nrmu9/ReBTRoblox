name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    env:
      # Optional. Without them the release ships an unsigned .xpi, which is
      # installable in Developer Edition and Nightly but not in release Firefox.
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
      # "unlisted" signs for self distribution. Set the AMO_CHANNEL repository
      # variable to "listed" to submit to the add-ons store instead.
      AMO_CHANNEL: ${{ vars.AMO_CHANNEL || 'unlisted' }}

    steps:
      # The tag object itself is needed to check its signature, so this cannot
      # be a shallow checkout.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      # Only the owner's own keys are imported, so a tag signed by anything
      # else fails for want of a public key rather than passing unnoticed.
      - name: Verify the tag is signed by the repository owner
        run: |
          tag="$GITHUB_REF_NAME"

          if [ "$(git cat-file -t "$tag")" != "tag" ]; then
            echo "::error::$tag is a lightweight tag. Releases must be annotated and signed: git tag -s $tag"
            exit 1
          fi

          curl -fsSL "https://github.com/${{ github.repository_owner }}.gpg" | gpg --batch --quiet --import

          # Trust here comes from where the key was fetched, not from a web of
          # trust the runner cannot have. Saying so keeps gpg from warning that
          # it cannot vouch for a key that is the only one in the keyring.
          gpg --list-keys --with-colons |
            awk -F: '/^fpr:/ { print $10 ":6:" }' |
            gpg --batch --quiet --import-ownertrust

          if ! git verify-tag "$tag"; then
            echo "::error::$tag is not signed by a gpg key published on the ${{ github.repository_owner }} account"
            exit 1
          fi

      # package.json drives the manifest version, so a tag that disagrees with
      # it would ship a build numbered differently from its own release.
      - name: Verify the tag matches package.json
        run: |
          tag="$GITHUB_REF_NAME"

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::$tag is not a semver tag of the form v1.2.3"
            exit 1
          fi

          version="$(node -p "require('./package.json').version")"

          if [ "${tag#v}" != "$version" ]; then
            echo "::error::tag $tag does not match package.json version $version"
            exit 1
          fi

      - run: npm ci

      # A tag can be pushed without CI having passed on the commit, so the
      # checks run again rather than being assumed.
      - run: npm run lint

      - run: npm run typecheck

      - run: npm run package

      - name: Sign the Firefox build through AMO
        if: env.AMO_JWT_ISSUER != ''
        run: |
          # Packaging leaves dist/ holding whichever target was built last, so
          # rebuild the firefox one for web-ext to sign.
          npm run build

          # A listed submission of minified code has to carry the sources the
          # reviewer builds from, taken straight from the tag being released.
          args=()
          if [ "$AMO_CHANNEL" = "listed" ]; then
            git archive --format=zip --prefix="rebtroblox/" "$GITHUB_REF_NAME" -o source.zip
            args+=(--upload-source-code source.zip)

            # AMO needs summary, categories and a license before it will create
            # a listing. Only the first listed version needs them.
            if [ -f amo-metadata.json ]; then
              args+=(--amo-metadata amo-metadata.json)
            fi

            # A listed version is signed only once a human has reviewed it,
            # which is days, not minutes. Waiting for that just times out and
            # fails a release whose upload already succeeded.
            args+=(--approval-timeout 0)
          fi

          npx --yes web-ext sign \
            --source-dir dist \
            --channel "$AMO_CHANNEL" \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET" \
            --artifacts-dir amo \
            "${args[@]}"

          if [ "$AMO_CHANNEL" = "listed" ]; then
            # Nothing signed comes back until a reviewer approves, so the store
            # is the install for firefox. The build still ships for nightly,
            # developer edition and about:debugging, but says in its own name
            # that it will not install in release firefox.
            unsigned="$(ls artifacts/*-firefox.xpi)"
            mv "$unsigned" "${unsigned%-firefox.xpi}-firefox-unsigned.xpi"
            echo "submitted to the add-ons store for review"
          else
            # The signed build lands on top of the unsigned one. The name is
            # read from where packaging wrote it: hardcoding it once shipped an
            # unsigned .xpi beside the signed one under a stale name.
            unsigned="$(ls artifacts/*-firefox.xpi)"
            mv "$(find amo -name '*.xpi' | head -n1)" "$unsigned"
            echo "signed $unsigned for self distribution"
          fi

      # Shipping an unsigned .xpi that looks signed is worse than not signing
      # at all, so this refuses to publish one.
      - name: Verify the .xpi carries Mozilla's signature
        if: env.AMO_JWT_ISSUER != '' && env.AMO_CHANNEL != 'listed'
        run: |
          xpi="$(ls artifacts/*-firefox.xpi)"

          if ! unzip -l "$xpi" | grep -q "META-INF/mozilla.rsa"; then
            echo "::error::$xpi is not signed"
            exit 1
          fi

          echo "$xpi carries Mozilla's signature"

      # Regenerated here so the sums cover the signed .xpi when there is one.
      - name: Checksum the artifacts
        run: |
          cd artifacts
          rm -f SHA256SUMS
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # Says which file to take, because the answer differs per channel and
      # picking the wrong one means an .xpi release firefox refuses to install.
      - name: Write the install note
        run: |
          slug="$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')"

          # Read from what was actually produced rather than from the config,
          # so a release with no credentials cannot claim to be signed.
          signed=""
          if [ -f artifacts/*-firefox.xpi ] 2>/dev/null; then
            if unzip -l artifacts/*-firefox.xpi | grep -q "META-INF/mozilla.rsa"; then
              signed="yes"
            fi
          fi

          {
            if [ -n "$signed" ]; then
              echo "The \`.xpi\` below is signed by Mozilla and installs in Firefox"
              echo "directly. Open it with Firefox, or drag it onto the browser."
            elif [ "$AMO_CHANNEL" = "listed" ]; then
              echo "Install for Firefox from"
              echo "[addons.mozilla.org](https://addons.mozilla.org/firefox/addon/$slug/)."
              echo
              echo "The \`-unsigned.xpi\` below is the same build without Mozilla's"
              echo "signature. Release Firefox will not install it; it is there for"
              echo "Nightly, Developer Edition, \`about:debugging\`, and inspection."
            else
              echo "The \`.xpi\` below is **not signed**. Release Firefox will not"
              echo "install it; it is there for Nightly, Developer Edition and"
              echo "\`about:debugging\`."
            fi
          } > "$RUNNER_TEMP/NOTE.md"

          cat "$RUNNER_TEMP/NOTE.md"

      - uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*
          body_path: ${{ runner.temp }}/NOTE.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
